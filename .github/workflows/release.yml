name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cross-compile aggst (pure Go, static)
        run: |
          set -eux
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}; GOARCH=${target#*/}
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath -ldflags="-s -w" \
              -o "aggst-$GOOS-$GOARCH$ext" ./cmd/aggst
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aggst
          path: aggst-*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aggst-*

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            build: wails build -tags webkit2_41
            package: tar -czf aggregate-speedtest-linux-amd64.tar.gz -C build/bin aggregate-speedtest
            artifact: aggregate-speedtest-linux-amd64.tar.gz
          - os: windows-latest
            name: windows-amd64
            build: wails build
            package: Compress-Archive -Path build/bin/aggregate-speedtest.exe -DestinationPath aggregate-speedtest-windows-amd64.zip
            artifact: aggregate-speedtest-windows-amd64.zip
          - os: macos-latest
            name: macos-universal
            build: wails build -platform darwin/universal
            package: ditto -c -k --keepParent build/bin/aggregate-speedtest.app aggregate-speedtest-macos-universal.zip
            artifact: aggregate-speedtest-macos-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: ${{ matrix.build }}

      - name: Package
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
